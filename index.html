<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">  <!-- 默认 light，可通过 JS 切换 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引导</title>

    <style>
        /* 字体引入 */
        @font-face {
            font-family: "Ubuntu";
            src: url("./static/fonts/Ubuntu-Regular.ttf");
            font-display: swap;
        }

        /* 全局样式 */
        :root {
            --background-color: #f5f5f7;
            --text-color: #1d1d1f;
            --secondary-text-color: #86868b;
            --accent-color: #0071e3;
            --card-background: #ffffff;
            --border-color: #e3e3e3;
            --header-background: rgba(245, 245, 247, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --background-color: #1d1d1f;
            --text-color: #f5f5f7;
            --secondary-text-color: #86868b;
            --accent-color: #0a84ff;
            --card-background: #2c2c2e;
            --border-color: #3a3a3c;
            --header-background: rgba(29, 29, 31, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            background-image: url("./static/img/background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(245, 245, 247, 0.9);
            z-index: -1;
            transition: background-color 0.3s ease;
        }

        [data-theme="dark"] body::before {
            background-color: rgba(29, 29, 31, 0.9);
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--header-background);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
        }

        .navbar-logo {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
        }

        .navbar-link {
            font-size: 12px;
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .navbar-link:hover {
            opacity: 1;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .theme-toggle:hover {
            opacity: 1;
        }

        /* 内容占位（让页脚不贴顶） */
        main {
            flex: 1;
            min-height: calc(100vh - 44px - 120px); /* 粗略留空间给 nav + footer */
        }

        /* 页脚 */
        .footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background-color: var(--card-background);
            margin-top: auto;
        }

        .footer-text {
            font-size: 12px;
            color: var(--secondary-text-color);
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .footer-link {
            font-size: 12px;
            color: var(--secondary-text-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--accent-color);
        }

        .footer-copyright {
            font-size: 12px;
            color: var(--secondary-text-color);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </nav>

    <!-- 主内容占位（目前为空白，你可以以后加回内容） -->
    <main></main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-text">Xtn © 2025</div>
        <div class="footer-links">
        </div>
        <div class="footer-copyright">
            ❤️
        </div>
    </footer>

    <script>
        // 主题切换功能（保留）
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
