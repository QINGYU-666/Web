<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtn - 夏透喃</title>
    <link rel="icon" href="/Web/static/img/favicon.ico">
    <meta name="description" content="Xtn.....">
    <meta name="keywords" content="xtn,喃娘,nanniang,喃娘主页,夏透喃引导页,NanNiang，XtnAPI,喃娘API,免费API">
    <style>
        /* 字体引入 */
        @font-face {
            font-family: "Ubuntu";
            src: url("/Web/static/fonts/Ubuntu-Regular.ttf");
            font-display: swap;
        }

        @font-face {
            font-family: "Pacifico";
            src: url("/Web/static/fonts/Pacifico-Regular.ttf");
            font-display: swap;
        }

        /* 全局样式 */
        :root {
            --background-color: #f5f5f7;
            --text-color: #1d1d1f;
            --secondary-text-color: #86868b;
            --accent-color: #0071e3;
            --card-background: #ffffff;
            --border-color: #e3e3e3;
            --header-background: rgba(245, 245, 247, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --background-color: #1d1d1f;
            --text-color: #f5f5f7;
            --secondary-text-color: #86868b;
            --accent-color: #0a84ff;
            --card-background: #2c2c2e;
            --border-color: #3a3a3c;
            --header-background: rgba(29, 29, 31, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            background-image: url("./static/img/background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(245, 245, 247, 0.9);
            z-index: -1;
            transition: background-color 0.3s ease;
        }

        [data-theme="dark"] body::before {
            background-color: rgba(29, 29, 31, 0.9);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--header-background);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
        }

        .navbar-logo {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
        }

        .navbar-link {
            font-size: 12px;
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .navbar-link:hover {
            opacity: 1;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .theme-toggle:hover {
            opacity: 1;
        }

        .hero {
            padding-top: 100px;
            padding-bottom: 80px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 30px;
            object-fit: cover;
            border: 3px solid var(--card-background);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
            font-family: "Pacifico", cursive;
        }

        .hero-subtitle {
            font-size: 24px;
            color: var(--secondary-text-color);
            margin-bottom: 32px;
            font-weight: 400;
        }

        .tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 60px;
        }

        .tag {
            padding: 6px 16px;
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            font-size: 12px;
            color: var(--secondary-text-color);
            transition: all 0.2s ease;
        }

        .tag:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            margin-bottom: 80px;
        }

        .section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
        }

        .contacts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .contact-card {
            background-color: var(--card-background);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .contact-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .contact-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .contact-content {
            padding: 24px;
        }

        .contact-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .contact-description {
            font-size: 14px;
            color: var(--secondary-text-color);
        }

        .timeline {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background-color: var(--border-color);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--accent-color);
            top: 15px;
            z-index: 1;
        }

        .timeline-item.left {
            left: 0;
        }

        .timeline-item.right {
            left: 50%;
        }

        .timeline-item.left::after {
            right: -8px;
        }

        .timeline-item.right::after {
            left: -8px;
        }

        .timeline-content {
            padding: 20px;
            background-color: var(--card-background);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .timeline-year {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .timeline-text {
            font-size: 14px;
            color: var(--secondary-text-color);
        }

        .footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background-color: var(--card-background);
        }

        .footer-text {
            font-size: 12px;
            color: var(--secondary-text-color);
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .footer-link {
            font-size: 12px;
            color: var(--secondary-text-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--accent-color);
        }

        .footer-copyright {
            font-size: 12px;
            color: var(--secondary-text-color);
        }

        @media (max-width: 768px) {
            .navbar-links {
                display: none;
            }

            .hero-title {
                font-size: 36px;
            }

            .hero-subtitle {
                font-size: 20px;
            }

            .timeline::after {
                left: 31px;
            }

            .timeline-item {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
            }

            .timeline-item.right {
                left: 0;
            }

            .timeline-item.left::after,
            .timeline-item.right::after {
                left: 23px;
            }

            .contacts {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
    </style>
</head>
<body>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
            el.style.animationPlayState = 'paused';
            observer.observe(el);
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
