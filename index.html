<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-color="pink">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晴雨的导航</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Quicksand:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --hue: 340;
            --accent: #ff8fa3;
            --accent-dark: #ff6b9d;
            --bg: #fff0f3;
            --glass: rgba(255,255,255,0.75);
            --glass-border: rgba(255,255,255,0.5);
            --text: #5a3a45;
            --text-light: #9a7185;
            --glow: 0 8px 32px rgba(255,143,163,0.25);
        }

        [data-theme="dark"] {
            --bg: #1a1216;
            --glass: rgba(45,31,36,0.75);
            --glass-border: rgba(255,255,255,0.12);
            --text: #ffe4ec;
            --text-light: #c9a5b5;
            --glow: 0 8px 32px rgba(255,143,163,0.18);
        }

        /* 其他配色（只列出变量变化部分） */
        [data-color="mint"]   { --hue:160; --accent:#88d8b0; --accent-dark:#5eead4; --bg:#f0fdf9; }
        [data-color="honey"]  { --hue: 35; --accent:#fbbf24; --accent-dark:#f59e0b; --bg:#fffbeb; }
        [data-color="lavender"] { --hue:260; --accent:#c4b5fd; --accent-dark:#a78bfa; --bg:#f5f3ff; }
        [data-color="ocean"]  { --hue:200; --accent:#7dd3fc; --accent-dark:#38bdf8; --bg:#f0f9ff; }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Quicksand', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .dynamic-bg, .paw-bg { position:fixed; inset:0; pointer-events:none; z-index:-2; overflow:hidden; }
        .bg-blob {
            position:absolute; border-radius:50%; filter:blur(80px); opacity:0.35;
            animation: blob 22s infinite ease-in-out;
        }
        .bg-blob:nth-child(1) { width:480px; height:480px; background:var(--accent); top:-15%; left:-15%; }
        .bg-blob:nth-child(2) { width:360px; height:360px; background:var(--accent-dark); bottom:-10%; right:-10%; animation-delay:-8s; }

        @keyframes blob { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(40px,-60px) scale(1.08); } }

        /* 爪爪背景简化：用一个 symbol 复用 */
        svg.paw-symbol { display:none; }
        .bg-paw {
            position:absolute; width:90px; height:90px; opacity:0.18;
            fill:var(--accent); animation:paw-float 18s infinite ease-in-out;
        }
        @keyframes paw-float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-24px) rotate(4deg); } }

        .loader { position:fixed; inset:0; background:var(--bg); z-index:9999; display:grid; place-items:center; transition:opacity .5s; }
        .loader.hidden { opacity:0; visibility:hidden; }
        .loader-paw { width:60px; height:60px; fill:var(--accent); animation:bounce 1.2s infinite; }

        main {
            min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:100px 16px 140px;
        }

        .profile-card {
            position:relative; width:100%; max-width:420px; padding:40px 28px;
            background:var(--glass); backdrop-filter:blur(20px);
            border:1px solid var(--glass-border); border-radius:28px;
            box-shadow:0 16px 48px rgba(0,0,0,0.08), var(--glow);
            transition:transform .4s;
        }

        .avatar-container {
            position:relative; width:128px; height:128px; margin:0 auto 24px;
        }
        .avatar {
            width:100%; height:100%; border-radius:50%; object-fit:cover;
            border:3px solid transparent; background:linear-gradient(var(--bg),var(--bg)) padding-box,
            linear-gradient(135deg,var(--accent),var(--accent-dark)) border-box;
            box-shadow:0 8px 32px rgba(0,0,0,0.12);
            transition:all .35s;
        }
        .avatar-container:hover .avatar { transform:scale(1.06); box-shadow:0 12px 48px rgba(0,0,0,0.18); }

        h1 {
            font-family:'Nunito',sans-serif; font-size:2.4rem; font-weight:800; text-align:center;
            background:linear-gradient(135deg,var(--text),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .subtitle { text-align:center; color:var(--text-light); margin:8px 0 28px; font-size:1.05rem; }

        .status-box {
            background:rgba(255,255,255,0.25); border:1px dashed var(--accent);
            border-radius:16px; padding:12px 16px; margin:0 0 32px;
            font-size:0.94rem; color:var(--text-light); text-align:center;
            backdrop-filter:blur(8px);
        }

        .links-grid { display:flex; flex-direction:column; gap:14px; margin-bottom:32px; }
        .link-btn {
            display:flex; align-items:center; justify-content:center; gap:10px;
            padding:15px 24px; border-radius:16px; font-weight:700; font-size:1rem;
            color:var(--text); text-decoration:none; background:rgba(255,255,255,0.35);
            border:1px solid var(--glass-border); backdrop-filter:blur(10px);
            transition:all .28s;
        }
        .link-btn:hover {
            background:linear-gradient(135deg,var(--accent),var(--accent-dark));
            color:white; transform:translateY(-2px); box-shadow:var(--glow);
        }

        .social-bar {
            display:flex; gap:20px; justify-content:center; margin:24px 0;
        }
        .social-icon {
            width:36px; height:36px; border-radius:50%; background:var(--glass);
            backdrop-filter:blur(10px); border:1px solid var(--glass-border);
            display:grid; place-items:center; color:var(--text); transition:all .3s;
        }
        .social-icon:hover { transform:scale(1.15); background:var(--accent); color:white; }

        .footer {
            position:fixed; bottom:0; left:0; right:0; padding:16px;
            text-align:center; font-size:0.82rem; color:var(--text-light);
            background:linear-gradient(to top, var(--bg), transparent);
            pointer-events:none;
        }
        .footer span { pointer-events:auto; }

        /* 设置面板（简化版） */
        .settings-btn { position:fixed; top:20px; left:20px; z-index:1001; width:48px; height:48px;
            background:var(--glass); backdrop-filter:blur(12px); border:1px solid var(--glass-border);
            border-radius:50%; box-shadow:var(--glow); cursor:pointer; display:grid; place-items:center; }
        .settings-panel { position:fixed; inset:0; background:rgba(0,0,0,0.2); backdrop-filter:blur(4px); z-index:1000;
            opacity:0; visibility:hidden; transition:all .4s; }
        .settings-panel.open { opacity:1; visibility:visible; }
        .panel-content { width:320px; height:100%; background:var(--glass); backdrop-filter:blur(24px);
            transform:translateX(-100%); transition:transform .4s; padding:80px 24px 40px; }
        .settings-panel.open .panel-content { transform:translateX(0); }

        @media (max-width:480px) {
            .profile-card { padding:32px 20px; }
            h1 { font-size:2rem; }
            .avatar-container { width:110px; height:110px; }
        }
    </style>
</head>
<body>

<svg class="paw-symbol" viewBox="0 0 100 100">
    <symbol id="paw" viewBox="0 0 100 100">
        <ellipse cx="50" cy="65" rx="20" ry="16"/>
        <ellipse cx="28" cy="38" rx="9" ry="11" transform="rotate(-20 28 38)"/>
        <ellipse cx="42" cy="26" rx="9" ry="11"/>
        <ellipse cx="58" cy="26" rx="9" ry="11"/>
        <ellipse cx="72" cy="38" rx="9" ry="11" transform="rotate(20 72 38)"/>
    </symbol>
</svg>

<div class="loader" id="loader">
    <svg class="loader-paw" viewBox="0 0 100 100"><use href="#paw"/></svg>
</div>

<div class="dynamic-bg">
    <div class="bg-blob"></div><div class="bg-blob"></div>
</div>

<div class="paw-bg">
    <svg class="bg-paw" style="top:8%;left:6%;animation-delay:0s"><use href="#paw"/></svg>
    <svg class="bg-paw" style="top:55%;right:10%;animation-delay:6s"><use href="#paw"/></svg>
    <svg class="bg-paw" style="bottom:18%;left:12%;animation-delay:11s"><use href="#paw"/></svg>
</div>

<button class="settings-btn" id="settingsBtn">⚙</button>

<div class="settings-panel" id="settingsPanel">
    <div class="panel-content">
        <h3 style="margin-bottom:28px;color:var(--accent);">主题设置</h3>
        <!-- 这里可以保留你的颜色选择和深色模式切换逻辑 -->
        <!-- 为了示例简化，实际请把原 JS 逻辑迁移过来 -->
    </div>
</div>

<main>
    <div class="profile-card">
        <div class="avatar-container">
            <img src="/Web/static/img/logo.jpg" alt="晴雨" class="avatar">
        </div>

        <h1>晴雨</h1>
        <div class="subtitle">zako～ zako～</div>

        <div class="status-box" id="moyuStatus">
            今天也偷偷摸鱼中… (ฅ´ω`ฅ)
        </div>

        <div class="links-grid">
            <a href="mqqapi://..." class="link-btn">QQ 联系我</a>
            <a href="http://qm.qq.com/..." class="link-btn">加入 QQ 群</a>
            <a href="https://t.me/QINGYUTvT" class="link-btn">Telegram</a>
            <a href="https://bbs.binmt.cc/..." class="link-btn">Mt 论坛</a>
        </div>

        <div class="social-bar">
            <a href="#" class="social-icon" title="GitHub">Git</a>
            <a href="#" class="social-icon" title="Bilibili">B站</a>
            <a href="#" class="social-icon" title="Twitter/X">X</a>
        </div>
    </div>
</main>

<footer class="footer">
    <span>© 2025 晴雨 · <span id="moyuQuote">摸鱼也要元气满满！</span></span>
</footer>

<script>
    // 加载动画
    window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);
    });

    // 随机摸鱼语录（可自行扩充）
    const moyuLines = [
        "今天也偷偷摸鱼中… (ฅ´ω`ฅ)",
        "工作？不存在的～ zzz",
        "zako zako～ 再摆烂五分钟！",
        "老板看不到我，老板看不到我…",
        "人生苦短，必须摸鱼 ( •̀ ω •́ )✧",
        "已进入贤者时间……",
        "别催，我在思考人生（划掉）在发呆"
    ];

    function updateMoyu() {
        const status = document.getElementById('moyuStatus');
        const footerQuote = document.getElementById('moyuQuote');
        const random = moyuLines[Math.floor(Math.random() * moyuLines.length)];
        status.textContent = random;
        footerQuote.textContent = random.split(' ')[0]; // 简短版放 footer
    }

    updateMoyu();
    // 可选：每隔 4-8 分钟刷新一次
    setInterval(updateMoyu, 1000 * 60 * (4 + Math.random() * 4));

    // 设置面板开关（简化示例）
    document.getElementById('settingsBtn').addEventListener('click', () => {
        document.getElementById('settingsPanel').classList.toggle('open');
    });
</script>
</body>
</html>
