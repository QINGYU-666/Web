<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晴雨的导航</title>

    <style>
        @font-face {
            font-family: "Ubuntu";
            src: url("./static/fonts/Ubuntu-Regular.ttf");
            font-display: swap;
        }

        :root {
            --background-color: #f5f5f7;
            --text-color: #1d1d1f;
            --secondary-text: #6e6e73;
            --accent-color: #0071e3;
            --card-bg: rgba(255, 255, 255, 0.75);
            --border-color: rgba(0,0,0,0.08);
            --header-bg: rgba(245,245,247,0.85);
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --background-color: #0f0f11;
            --text-color: #f5f5f7;
            --secondary-text: #a1a1aa;
            --accent-color: #60a5fa;
            --card-bg: rgba(28, 28, 30, 0.75);
            --border-color: rgba(255,255,255,0.08);
            --header-bg: rgba(15,15,17,0.85);
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Ubuntu", system-ui, -apple-system, sans-serif;
            background: var(--background-color) url("./static/img/background.jpg") center/cover fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(245,245,247,0.92);
            z-index: -2;
            transition: background 0.4s ease;
        }

        [data-theme="dark"] body::before {
            background: rgba(15,15,17,0.92);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.85;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-6px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--secondary-text);
            margin-bottom: 32px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 32px 0;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-color);
            text-decoration: none;
            background: rgba(255,255,255,0.35);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        [data-theme="dark"] .link-btn {
            background: rgba(40,40,45,0.4);
        }

        .link-btn:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,113,227,0.3);
        }

        .link-btn:active {
            transform: translateY(0);
        }

        .footer {
            padding: 32px 20px;
            text-align: center;
            color: var(--secondary-text);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .profile-card {
                padding: 36px 24px;
                border-radius: 20px;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </nav>

    <main>
        <div class="profile-card">
            <!-- 建议你换成自己的头像，放在 static/img/avatar.jpg -->
            <img src="./static/img/logo.png" alt="Avatar" class="avatar">

            <h1>晴雨</h1>
            <div class="subtitle">zako～ zako～</div>

            <div class="links-grid">
                <a href="https://qm.qq.com/cgi-bin/qm/qr?k=3972665547" class="link-btn" target="_blank" rel="noopener">
                    QQ
                </a>

                <a href="https://qm.qq.com/cgi-bin/qm/qr?k=1017770500&jump_from=webapi" class="link-btn" target="_blank" rel="noopener">
                    QQ群
                </a>

                <a href="https://t.me/QINGYUTvT" class="link-btn" target="_blank" rel="noopener">
                    Telegram
                </a>

                <a href="https://bbs.binmt.cc/home.php?mod=space&uid=147952&do=profile" class="link-btn" target="_blank" rel="noopener">
                    Mt论坛
                </a>

                <!-- 可选：如果你有米游社或其他链接也可以加 -->
                <!-- <a href="https://www.miyoushe.com/ys" class="link-btn" target="_blank">米游社</a> -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 晴雨 • Powered by GitHub Pages</p>
        <p>❤️ 摸鱼也要有态度</p>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // 读取保存的主题
        const saved = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', saved);
        toggle.textContent = saved === 'dark' ? '☀️' : '🌙';

        toggle.addEventListener('click', () => {
            let theme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
